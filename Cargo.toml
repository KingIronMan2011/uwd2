[package]
name = "uwd2"
version = "1.2.1"
edition = "2021"

[dependencies]
directories = "6.0.0"
pdb = "0.8.0"
sysinfo = "0.39.6"
ureq = "3.4.0"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security"
]

[build-dependencies]
winres = "0.1.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
